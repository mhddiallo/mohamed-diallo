# Déploiement sur le VPS : site + PostgreSQL.
#
# Le HTTPS est géré par le Caddy déjà présent sur le serveur, qui joint le
# site via le réseau Docker partagé « web » (nom du conteneur : mohamed-diallo-app).
#   docker network create web        (une seule fois)
#   docker compose up -d --build
#
# Sur un serveur sans reverse proxy, activez le Caddy fourni :
#   docker compose --profile caddy up -d --build

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://mohamed-diallo.com}
    container_name: mohamed-diallo-app
    restart: unless-stopped
    networks:
      - default
      - web
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-site}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-site}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://mohamed-diallo.com}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-site}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-site}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-site} -d ${POSTGRES_DB:-site}']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    profiles: ['caddy']
    restart: unless-stopped
    networks:
      - web
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

networks:
  web:
    external: true

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
